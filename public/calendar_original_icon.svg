
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Realistic 3D drop shadow exactly like the reference icon -->
    <filter id="calShadow" x="-15%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10" />
    </filter>
    <clipPath id="calClip">
      <rect x="18" y="14" width="220" height="220" rx="48" />
    </clipPath>
    <!-- Vibrant 3D Apple Red Header Gradient with top specular highlight -->
    <linearGradient id="redHeadGrad" x1="128" y1="14" x2="128" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF382E" />
      <stop offset="50%" stop-color="#E82219" />
      <stop offset="100%" stop-color="#D61810" />
    </linearGradient>
    <!-- Crisp White Card Body with subtle ambient gradient -->
    <linearGradient id="bodyGrad" x1="128" y1="98" x2="128" y2="234" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FAFAFC" />
      <stop offset="100%" stop-color="#ECECEF" />
    </linearGradient>
  </defs>

  <!-- Shadow Card -->
  <g filter="url(#calShadow)">
    <rect x="18" y="14" width="220" height="220" rx="48" fill="#FFFFFF" />
    
    <!-- Clipped Calendar Content -->
    <g clip-path="url(#calClip)">
      <!-- White/Light Gray Base Card -->
      <rect x="18" y="14" width="220" height="220" fill="url(#bodyGrad)" />

      <!-- Top Red Banner -->
      <rect x="18" y="14" width="220" height="84" fill="url(#redHeadGrad)" />

      <!-- Top Inner Edge Specular Glint -->
      <line x1="28" y1="15.5" x2="228" y2="15.5" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

      <!-- Subtle Header Divider Crease -->
      <line x1="18" y1="98" x2="238" y2="98" stroke="rgba(0,0,0,0.08)" stroke-width="1.5" />

      <!-- Bold FRI Label -->
      <text
        x="128"
        y="65"
        fill="#FFFFFF"
        font-size="44"
        font-weight="900"
        font-family="system-ui, -apple-system, 'SF Pro Text', 'Arial Black', sans-serif"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="0.05em"
      >FRI</text>

      <!-- Bold 16 Date Numeral -->
      <text
        x="128"
        y="166"
        fill="#111111"
        font-size="108"
        font-weight="800"
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-0.03em"
      >16</text>
    </g>

    <!-- Subtle Border Stroke -->
    <rect x="18" y="14" width="220" height="220" rx="48" stroke="rgba(0,0,0,0.08)" stroke-width="1.5" />
  </g>
</svg>
